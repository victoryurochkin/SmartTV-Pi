IMG_NAME=hometv-pi
PI_GEN_RELEASE='HomeTV Pi'
RELEASE=trixie
DEPLOY_COMPRESSION=none
FIRST_USER_NAME=hometv
# pi-gen requires a nonempty bootstrap credential when bypassing its stock wizard.
# The appliance stage replaces the shadow entry with a password lock before export.
FIRST_USER_PASS=$(</proc/sys/kernel/random/uuid)
DISABLE_FIRST_BOOT_USER_RENAME=1
ENABLE_CLOUD_INIT=0
ENABLE_SSH=0
TARGET_HOSTNAME=hometv
LOCALE_DEFAULT=ru_RU.UTF-8
KEYBOARD_KEYMAP=us
KEYBOARD_LAYOUT='English (US)'
TIMEZONE_DEFAULT=Etc/UTC
STAGE_LIST='stage0 stage1 stage2 stage-hometv-packages stage-hometv-appliance'
